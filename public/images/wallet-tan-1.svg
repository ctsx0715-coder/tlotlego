    <rect x="596" y="500" width="8" height="480" fill="#96724a" opacity="0.5"/>
    <path d="M290 530 L910 530 L910 950 L290 950 Z" fill="none" stroke="#e8d3ab" stroke-width="3" stroke-dasharray="11 9" stroke-linecap="round" opacity="0.75"/>
    <rect x="300" y="720" width="270" height="10" fill="#96724a" opacity="0.4"/>
    <rect x="260" y="500" width="680" height="480" rx="26" fill="url(#sheen)" opacity="0.5"/>
